---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master/deployment.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flakemill
  namespace: flakemill
  labels:
    app.kubernetes.io/name: flakemill
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: flakemill
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flakemill
    spec:
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      containers:
        - name: flakemill
          image: ghcr.io/scottmckendry/flakemill:v0.2.1@sha256:0cbf96cb861706fd23992ba81198845eba8203b4b33d08e7842f9de7d9e3c6c6
          imagePullPolicy: IfNotPresent
          # nix inside the container needs a real /dev (mknod etc.)
          securityContext:
            privileged: true
          env:
            - name: RUST_LOG
              value: info
            - name: REPO_URL
              value: https://github.com/scottmckendry/nix
            - name: SYSTEMS
              value: eris
            - name: CACHIX_CACHE
              value: scottmckendry
            - name: SIGN_KEY
              value: /secrets/sign.key
            - name: INTERVAL_SECS
              value: "3600"
          envFrom:
            - secretRef:
                name: flakemill
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /var/lib/flakemill
            - name: nix
              mountPath: /nix
            - name: secrets
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: flakemill-data
        - name: nix
          persistentVolumeClaim:
            claimName: flakemill-nix
        - name: secrets
          secret:
            secretName: flakemill
