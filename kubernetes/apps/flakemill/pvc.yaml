---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master/persistentvolumeclaim.json
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: flakemill-data
  namespace: flakemill
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: flakemill-nix
  namespace: flakemill
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 80Gi
