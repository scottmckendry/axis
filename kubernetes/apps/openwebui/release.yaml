---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
  namespace: openwebui
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      open-webui:
        replicas: 1
        strategy: Recreate
        containers:
          app:
            image:
              repository: openwebui/open-webui
              tag: 0.13.5@sha256:e0dc5a8bf5c71cadf339d1e7b9408b357da75fb2854f82cad57a1609fadf2a22
            env:
              WEBUI_URL: https://chat.axis.scottmckendry.tech
              ENABLE_SIGNUP: "false"
              ENABLE_OLLAMA_API: "false"
              OPENAI_API_BASE_URL: https://opencode.ai/inference/go/openai/v1
            envFrom:
              - secretRef:
                  name: open-webui
            probes:
              liveness:
                enabled: true
                type: HTTP
                path: /health
                port: 8080
              readiness:
                enabled: true
                type: HTTP
                path: /health
                port: 8080
                spec:
                  initialDelaySeconds: 10
              startup:
                enabled: true
                type: HTTP
                path: /health
                port: 8080
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: open-webui
        ports:
          http:
            port: 8080
    persistence:
      data:
        existingClaim: open-webui
        globalMounts:
          - path: /app/backend/data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
