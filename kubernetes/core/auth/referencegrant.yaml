---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/referencegrant_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: allow-gateway-extauth
  namespace: auth
spec:
  from:
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: envoy-gateway-system
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: actual
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: headlamp
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: hermes
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: home-assistant
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: homepage
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: media
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: monitoring
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: pgadmin
  to:
    - group: ""
      kind: Service
